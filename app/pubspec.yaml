name: uns
description: "Uns — prayer tools and mood-based Quran listening."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  adhan: ^2.0.0+1
  drift: ^2.35.0
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  geolocator: ^14.0.3
  geomag: ^0.3.0
  go_router: ^18.0.1
  http: ^1.6.0
  intl: any
  just_audio: ^0.10.6
  path: ^1.9.1
  path_provider: ^2.1.6
  purchases_flutter: ^10.13.1
  sqlite3: ^3.6.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/data/

hooks:
  user_defines:
    sqlite3:
      # SQLite3MultipleCiphers: encrypted databases (see architecture.md).
      source: sqlite3mc
