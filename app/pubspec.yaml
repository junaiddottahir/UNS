name: uns
description: "Uns — prayer tools and mood-based Quran listening."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  adhan: ^2.0.0+1
  audio_session: ^0.2.4
  cryptography: ^2.9.0
  drift: ^2.35.0
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  geolocator: ^14.0.3
  geomag: ^0.3.0
  go_router: ^18.0.1
  http: ^1.6.0
  intl: any
  just_audio: ^0.10.6
  path: ^1.9.1
  path_provider: ^2.1.6
  purchases_flutter: ^10.13.1
  record: ^7.1.1
  speech_to_text: ^7.5.0
  sqlite3: ^3.6.0
  supabase_flutter: ^2.17.2
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/data/
    - assets/icons/
    - assets/audio/

  # Athletics (the brand font). The files in the repo root are web-font
  # copies, not a licence to ship it. Once the licensed desktop/app OTFs
  # are bought, put them in assets/fonts/ and uncomment this block.
  # fonts:
  #   - family: Athletics
  #     fonts:
  #       - asset: assets/fonts/Athletics-Light.otf
  #         weight: 300
  #       - asset: assets/fonts/Athletics-Regular.otf
  #         weight: 400
  #       - asset: assets/fonts/Athletics-Medium.otf
  #         weight: 500
  #       - asset: assets/fonts/Athletics-Bold.otf
  #         weight: 700
  #       - asset: assets/fonts/Athletics-ExtraBold.otf
  #         weight: 800
  #       - asset: assets/fonts/Athletics-Black.otf
  #         weight: 900

hooks:
  user_defines:
    sqlite3:
      # SQLite3MultipleCiphers: encrypted databases (see architecture.md).
      source: sqlite3mc
